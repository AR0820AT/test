<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>test</title>
    <meta name="description" content="个人网页小工具" />
    <meta name="theme-color" content="#120c0e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="test" />
    <!-- 字体：思源宋体 Noto Serif SC（中文 500/600）+ Cormorant Garamond（英文正文，古典衬线）+
         Pirata One（哥特风 Blackletter，用于标题与名字牌）。加载失败时自动回落到系统宋体 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- 中文字体分片多、体积大：不阻塞首屏，先按系统宋体渲染，字体到位后自动替换 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc/500.css"
      media="print"
      onload="this.media='all'"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond/500.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond/600.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/pirata-one/400.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
